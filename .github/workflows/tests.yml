name: Test SPOTONE
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[reconstruction]"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts tests
      - run: spotone doctor
      - run: spotone published-model-info
      - run: spotone self-check
      - run: spotone predict-published examples/example.fasta -o results/published-example.csv
      - run: cmp results/published-example.csv docs/validation/published-example-prediction.csv
      - run: spotone demo --output-dir results/ci --trees 32
      - run: python -m pip wheel . --no-deps -w dist
